    <script>
      // Easter egg: 10 toques a la foto abren un video en pestaña nueva.
      (function () {
        var pfp = document.querySelector('.pfp');
        if (!pfp) return;
        var taps = 0;
        var timer = null;
        pfp.addEventListener('click', function () {
          taps += 1;
          clearTimeout(timer);
          timer = setTimeout(function () { taps = 0; }, 3000);
          if (taps >= 10) {
            taps = 0;
            window.open('https://www.youtube.com/watch?v=P7Wo7tMt6g8', '_blank', 'noopener');
          }
        });
      })();
